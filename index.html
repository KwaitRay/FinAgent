function replayHTML(){return '<div class="panel"><div class="controls"><button class="btn" id="prev-step">← 上一步</button><button class="btn primary" id="next-step">下一步 →</button><button class="btn" id="play">自动回放</button><button class="btn" id="reset">重置</button><span class="muted" id="step-count"></span></div><div class="progress"><i id="progress"></i></div><div class="timeline" aria-label="案例阶段">'+steps.map((s,i)=>'<button data-step="'+i+'">'+String(i+1).padStart(2,"0")+' '+s.tag+'</button>').join('')+'</div><div id="step-detail" aria-live="polite"></div></div>';}
function stopPlay(){if(playback.timer){clearInterval(playback.timer);playback.timer=null;}const b=$("#play");if(b)b.textContent="自动回放";}
function showStep(){const s=steps[playback.step];$("#step-detail").innerHTML='<div class="step-detail"><div><span class="pill green">'+s.tag+'</span><h3>'+s.title+'</h3><p>'+s.action+'</p><div class="field"><label>调用前状态</label><p>'+s.state+'</p></div><div class="field"><label>当前动作 / 接口</label><p>'+s.tool+'</p></div><div class="field"><label>返回与状态变化</label><p>'+s.result+'</p></div></div><div><div class="evidence"><h4>证据与验收进度</h4><ul>'+s.evidence.map(v=>'<li>'+v+'</li>').join('')+'</ul></div><div class="detail-strip"><b>训练中关注什么</b><p>'+s.learn+'</p></div></div></div>';$("#step-count").textContent=(playback.step+1)+" / "+steps.length;$("#progress").style.width=((playback.step+1)/steps.length*100)+"%";$("#prev-step").disabled=playback.step===0;$("#next-step").disabled=playback.step===steps.length-1;$$("[data-step]").forEach(b=>{b.classList.toggle("active",Number(b.dataset.step)===playback.step);b.setAttribute("aria-pressed",Number(b.dataset.step)===playback.step);});}
function initReplay(){showStep();$("#prev-step").onclick=()=>{stopPlay();playback.step--;showStep();};$("#next-step").onclick=()=>{stopPlay();playback.step++;showStep();};$("#reset").onclick=()=>{stopPlay();playback.step=0;showStep();};$$("[data-step]").forEach(b=>b.onclick=()=>{stopPlay();playback.step=Number(b.dataset.step);showStep();});$("#play").onclick=()=>{if(playback.timer){stopPlay();return;}if(playback.step===steps.length-1)playback.step=0;showStep();$("#play").textContent="暂停";playback.timer=setInterval(()=>{playback.step++;showStep();if(playback.step===steps.length-1)stopPlay();},2600);};}

let currentAdvantage=0;
function center(values,index,standard){const d=values[index]-avg(values);return standard?d/(sd(values)+1e-8):d;}
function updateRL(){
const s=rlState, r=[s.alpha*.2,s.alpha*.4,s.alpha*.4+(1-s.alpha)*s.outcome];
const g=[0,0,r[2]];g[1]=r[1]+s.gamma*g[2];g[0]=r[0]+s.gamma*g[1];
["alpha","outcome","gamma","ratio","epsilon"].forEach(k=>$("#"+k+"-value").textContent=fmt(s[k],2));
$("#total-r").textContent=fmt(r.reduce((a,b)=>a+b,0));$("#first-g").textContent=fmt(g[0]);
$("#returns").innerHTML=table(["阶段","即时奖励 rₜ","后续回报 Gₜ","计算"],r.map((v,i)=>["阶段 "+(i+1),fmt(v),'<b>'+fmt(g[i])+'</b>',i===2?fmt(v):fmt(v)+" + "+fmt(s.gamma,2)+" × "+fmt(g[i+1])]));
const R=r.reduce((a,b)=>a+b,0), totals=[R,.6,.15,.35], names=["甲 · 当前轨迹","乙 · 对照","丙 · 对照","丁 · 对照"];
const episode=center(totals,0,s.standard), mode=s.algo;
let html="";
$("#standard-row").hidden=mode==="tree";
if(mode==="grpo"){
currentAdvantage=episode;
html='<div class="grid2"><div>'+table(["同任务轨迹","总奖励","优势"],totals.map((v,i)=>[names[i],fmt(v),'<span class="'+(center(totals,i,s.standard)>=0?"positive":"negative")+'">'+fmt(center(totals,i,s.standard))+'</span>']))+'</div><div class="evidence"><h4>同一任务，比较完整结果</h4><p>组均值 '+fmt(avg(totals))+'；样本标准差 '+fmt(sd(totals))+'。</p><div class="formula">A甲 = '+fmt(currentAdvantage)+'</div><p>将该优势分配到甲的模型生成位置。正优势不意味着每个动作都正确。</p></div></div>';
}else if(mode==="gigpo"){
const local=[g[1],.56,.13], la=center(local,0,s.standard); currentAdvantage=episode+.5*la;
html='<div class="grid2"><div>'+table(["局部锚点成员","从该状态开始的回报","局部优势"],local.map((v,i)=>[names[i],fmt(v),fmt(center(local,i,s.standard))]))+'<p class="note">甲乙丙在第二阶段前具有可比状态；丁不在这个局部组。对照回报为固定演示输入。</p></div><div class="evidence"><h4>整体组＋相同锚点状态组</h4><div class="formula">A = A整体 + 0.5×A局部<br>= '+fmt(episode)+' + 0.5×'+fmt(la)+'<br>= '+fmt(currentAdvantage)+'</div><p>状态需匹配目标、进度、关键证据、权限与版本；仅子任务同名不足以归组。局部组无效则回退整体项。</p></div></div>';
}else if(mode==="tree"){
const a=[.9,.75,.3], b=[.6,.45,.3], whole=a.concat(b);currentAdvantage=(a[0]-avg(a))+(a[0]-avg(whole));
html='<div class="grid2"><div>'+table(["初始树","共享前缀后的分支","结果回报"],[["树甲","补需求 / 补业绩 / 重复新闻","0.90 / 0.75 / 0.30"],["树乙","三个替代研究分支","0.60 / 0.45 / 0.30"]])+'<p class="note">本分支使用独立固定算例，不受上方奖励滑块影响。为便于手算，仅展示中心化的组构造；正式复现按所选论文实现归一化。</p></div><div class="evidence"><h4>树内与跨树轨迹比较</h4><div class="formula">树内：0.90−0.65 = 0.25<br>跨树：0.90−0.55 = 0.35<br>组合演示：A = 0.60</div><p>这是分支后续整体收益，不是首个动作的因果收益；不是每个节点都自动有独立过程奖励。共享前缀和环境必须可恢复。</p></div></div>';
}else{
const peers=[g[1],.56,.13,0];currentAdvantage=center(peers,0,s.standard);
html='<div class="grid2"><div>'+table(["同一决策步位置","后续回报","优势 / 更新"],peers.map((v,i)=>[i===3?"丁 · 已结束":names[i],fmt(v),i===3?"参与零回报基线；不更新":fmt(center(peers,i,s.standard))]))+'</div><div class="evidence"><h4>按决策步数对齐，不要求状态相同</h4><p>组均值 '+fmt(avg(peers))+'，甲的优势为：</p><div class="formula">A甲 = '+fmt(currentAdvantage)+'</div><p>已结束轨迹的后续回报记0参与基线，其无效位置屏蔽梯度。不同工具与子智能体一步的成本不同，需检查步数可比性。</p></div></div>';
}
$("#advantage").innerHTML=html;
const clipped=Math.min(1+s.epsilon,Math.max(1-s.epsilon,s.ratio));
const raw=s.ratio*currentAdvantage, bounded=clipped*currentAdvantage, objective=Math.min(raw,bounded);
$("#policy-result").innerHTML='<div class="numbers"><div class="number"><small>当前示例优势</small><strong>'+fmt(currentAdvantage)+'</strong></div><div class="number"><small>裁剪后的比值</small><strong>'+fmt(clipped,2)+'</strong></div><div class="number"><small>代理目标 J</small><strong>'+fmt(objective)+'</strong></div></div><p class="note">min('+fmt(raw)+', '+fmt(bounded)+') = '+fmt(objective)+'。'+(currentAdvantage>=0?"正优势倾向提高该生成动作的概率。":"负优势倾向降低该生成动作的概率。")+'裁剪仅限制相应方向的代理激励，不保证概率比绝不越界。</p>';
}
